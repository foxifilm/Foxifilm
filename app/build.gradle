plugins {
    id 'com.android.application'
}

android {
    namespace 'de.foxifilm.app'
    compileSdk 34

    defaultConfig {
        applicationId "de.foxifilm.app"
        minSdk 21
        targetSdk 22
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
