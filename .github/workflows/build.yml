name: Build Foxifilm APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 platforms;android-22 build-tools;34.0.0 build-tools;30.0.3'

      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Copy App Icon
        run: |
          mkdir -p app/src/main/res/drawable
          if [ -f "Foxilogo.png.png" ]; then
            cp Foxilogo.png.png app/src/main/res/drawable/ic_launcher.png
          fi

      - name: Generate Gradle Wrapper & Build Release APK
        run: |
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload Foxifilm APK
        uses: actions/upload-artifact@v4
        with:
          name: Foxifilm-FireTV-APK
          path: app/build/outputs/apk/release/app-release.apk
