name: Foxifilm APK erstellen

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-22 build-tools;30.0.3'

      - name: Gradle 8.7 einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: App-Symbol kopieren
        run: |
          mkdir -p app/src/main/res/drawable
          if [ -f "Foxilogo.png.png" ]; then
            cp "Foxilogo.png.png" app/src/main/res/drawable/ic_launcher.png
          elif [ -f "Foxilogo.png" ]; then
            cp "Foxilogo.png" app/src/main/res/drawable/ic_launcher.png
          fi

      - name: Debug APK erstellen (für Fire TV Stick)
        run: gradle assembleDebug

      - name: Foxifilm APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Foxifilm-FireTV
          path: app/build/outputs/apk/debug/*.apk
