<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=1920, initial-scale=1.0">
  <title>Foxifilm - Genres</title>
  <style type="text/css">
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      -webkit-user-select: none;
      user-select: none;
    }
    #stage {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 1920px;
      height: 1080px;
      margin-left: -960px;
      margin-top: -540px;
      background-color: #000000;
      overflow: hidden;
      -webkit-transform-origin: center center;
      transform-origin: center center;
    }
    .header-area {
      width: 100%;
      text-align: center;
      padding-top: 28px;
      padding-bottom: 18px;
    }
    .brand-logo {
      height: 120px;
      width: auto;
      display: block;
      margin: 0 auto 10px auto;
    }
    .page-title {
      font-size: 46px;
      font-weight: bold;
      color: #ffffff;
      letter-spacing: 1px;
    }
    .genres-grid {
      width: 1620px;
      margin: 12px auto 0 auto;
    }
    .genre-row {
      width: 100%;
      margin-bottom: 28px;
      font-size: 0;
      text-align: center;
    }
    .genre-tile {
      position: relative;
      display: inline-block;
      vertical-align: top;
      width: 240px;
      height: 360px;
      margin-right: 36px;
      background-color: #141414;
      border: 4px solid #222222;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      outline: none !important;
      padding: 0;
      text-align: center;
    }
    .genre-tile.last-in-row {
      margin-right: 0;
    }
    .genre-tile::-moz-focus-inner {
      border: 0;
      padding: 0;
    }
    .genre-poster {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      z-index: 1;
    }
    .genre-overlay {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 135px;
      background: -webkit-linear-gradient(top, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 0.85) 55%, rgba(0, 0, 0, 0.96) 100%);
      background: linear-gradient(to bottom, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 0.85) 55%, rgba(0, 0, 0, 0.96) 100%);
      z-index: 2;
      pointer-events: none;
    }
    .genre-title {
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: 16px;
      z-index: 3;
      color: #ffffff;
      font-size: 31px;
      font-weight: bold;
      line-height: 1.18;
      word-wrap: break-word;
      text-shadow: 0 2px 8px #000000;
      pointer-events: none;
    }
    .genre-tile.is-focused {
      border: 4px solid #ffd700 !important;
      box-shadow: 0 0 22px rgba(255, 215, 0, 0.75) !important;
    }
  </style>
</head>
<body>
  <div id="stage">
    <div class="header-area">
      <img class="brand-logo" src="Foxilogo.png.png" alt="Foxifilm">
      <h1 class="page-title">Genres</h1>
    </div>

    <div class="genres-grid" id="genres-grid">
      <div class="genre-row">
        <button type="button" class="genre-tile" data-index="0" data-href="Actiongenre.html">
          <img class="genre-poster" src="Action.jpeg" alt="Action">
          <div class="genre-overlay"></div>
          <div class="genre-title">Action</div>
        </button>

        <button type="button" class="genre-tile" data-index="1" data-href="Thrillergenre.html">
          <img class="genre-poster" src="Thriller.jpeg" alt="Thriller">
          <div class="genre-overlay"></div>
          <div class="genre-title">Thriller</div>
        </button>

        <button type="button" class="genre-tile" data-index="2" data-href="Dramagenre.html">
          <img class="genre-poster" src="Drama.jpeg" alt="Drama">
          <div class="genre-overlay"></div>
          <div class="genre-title">Drama</div>
        </button>

        <button type="button" class="genre-tile" data-index="3" data-href="Komoediengenre.html">
          <img class="genre-poster" src="Komödie.jpeg" alt="Komödien">
          <div class="genre-overlay"></div>
          <div class="genre-title">Komödien</div>
        </button>

        <button type="button" class="genre-tile" data-index="4" data-href="Scifigenre.html">
          <img class="genre-poster" src="Sci-Fi.jpeg" alt="Sci-Fi">
          <div class="genre-overlay"></div>
          <div class="genre-title">Sci-Fi</div>
        </button>

        <button type="button" class="genre-tile last-in-row" data-index="5" data-href="Kindergenre.html">
          <img class="genre-poster" src="Kinder und Familienfilme.jpeg" alt="Kinder und Familie">
          <div class="genre-overlay"></div>
          <div class="genre-title">Kinder und Familie</div>
        </button>
      </div>

      <div class="genre-row">
        <button type="button" class="genre-tile" data-index="6" data-href="Maerchengenre.html">
          <img class="genre-poster" src="Märchen.jpeg" alt="Märchen">
          <div class="genre-overlay"></div>
          <div class="genre-title">Märchen</div>
        </button>

        <button type="button" class="genre-tile" data-index="7" data-href="Cartoongenre.html">
          <img class="genre-poster" src="Cartoon.jpeg" alt="Cartoon">
          <div class="genre-overlay"></div>
          <div class="genre-title">Cartoon</div>
        </button>

        <button type="button" class="genre-tile" data-index="8" data-href="Historischgenre.html">
          <img class="genre-poster" src="Historisch.jpeg" alt="Historisch">
          <div class="genre-overlay"></div>
          <div class="genre-title">Historisch</div>
        </button>

        <button type="button" class="genre-tile" data-index="9" data-href="Seriengenre.html">
          <img class="genre-poster" src="Serien Genre.jpeg" alt="Serien">
          <div class="genre-overlay"></div>
          <div class="genre-title">Serien</div>
        </button>

        <button type="button" class="genre-tile" data-index="10" data-href="Dokugenre.html">
          <img class="genre-poster" src="Dokus Genre.jpeg" alt="Dokus">
          <div class="genre-overlay"></div>
          <div class="genre-title">Dokus</div>
        </button>

        <button type="button" class="genre-tile last-in-row" data-index="11" data-href="Selfmadegenre.html">
          <img class="genre-poster" src="Self.jpeg" alt="Self-made-Content">
          <div class="genre-overlay"></div>
          <div class="genre-title">Self-made-Content</div>
        </button>
      </div>
    </div>
  </div>

  <script type="text/javascript">
    var GENRE_LINKS = [
      'Actiongenre.html',
      'Thrillergenre.html',
      'Dramagenre.html',
      'Komoediengenre.html',
      'Scifigenre.html',
      'Kindergenre.html',
      'Maerchengenre.html',
      'Cartoongenre.html',
      'Historischgenre.html',
      'Seriengenre.html',
      'Dokugenre.html',
      'Selfmadegenre.html'
    ];

    var COLS = 6;
    var tiles = [];
    var currentIndex = 0;

    function scaleStage() {
      var stage = document.getElementById('stage');
      var winW = window.innerWidth || document.documentElement.clientWidth || 1920;
      var winH = window.innerHeight || document.documentElement.clientHeight || 1080;
      var scaleX = winW / 1920;
      var scaleY = winH / 1080;
      var scale = scaleX < scaleY ? scaleX : scaleY;
      stage.style.webkitTransform = 'scale(' + scale + ')';
      stage.style.transform = 'scale(' + scale + ')';
    }

    function clearAllFocus() {
      var i;
      if (document.activeElement && document.activeElement.blur) {
        document.activeElement.blur();
      }
      for (i = 0; i < tiles.length; i++) {
        tiles[i].className = tiles[i].className.replace(/\s*is-focused/g, '');
      }
    }

    function setFocus(index) {
      if (index < 0) {
        index = 0;
      }
      if (index >= tiles.length) {
        index = tiles.length - 1;
      }
      clearAllFocus();
      currentIndex = index;
      tiles[currentIndex].className += ' is-focused';
    }

    function openGenre(index) {
      var target = GENRE_LINKS[index] || tiles[index].getAttribute('data-href');
      if (target) {
        window.location.href = target;
      }
    }

    function attachTileEvents(tile, idx) {
      tile.onmouseenter = function () {
        setFocus(idx);
      };
      tile.onmouseleave = function () {
        clearAllFocus();
      };
      tile.onclick = function () {
        openGenre(idx);
      };
    }

    function initGenres() {
      var grid = document.getElementById('genres-grid');
      var buttons = grid.getElementsByTagName('button');
      var i;
      for (i = 0; i < buttons.length; i++) {
        tiles.push(buttons[i]);
        attachTileEvents(buttons[i], i);
      }
      setFocus(0);
    }

    function handleKeyDown(e) {
      var evt = e || window.event;
      var code = evt.keyCode || evt.which;
      var key = evt.key || '';

      if (code === 39 || key === 'ArrowRight') {
        if (evt.preventDefault) { evt.preventDefault(); }
        if (currentIndex + 1 < tiles.length) {
          setFocus(currentIndex + 1);
        }
      } else if (code === 37 || key === 'ArrowLeft') {
        if (evt.preventDefault) { evt.preventDefault(); }
        if (currentIndex - 1 >= 0) {
          setFocus(currentIndex - 1);
        }
      } else if (code === 40 || key === 'ArrowDown') {
        if (evt.preventDefault) { evt.preventDefault(); }
        if (currentIndex + COLS < tiles.length) {
          setFocus(currentIndex + COLS);
        }
      } else if (code === 38 || key === 'ArrowUp') {
        if (evt.preventDefault) { evt.preventDefault(); }
        if (currentIndex - COLS >= 0) {
          setFocus(currentIndex - COLS);
        }
      } else if (code === 13 || key === 'Enter') {
        if (evt.preventDefault) { evt.preventDefault(); }
        openGenre(currentIndex);
      } else if (code === 8 || code === 27 || code === 4 || code === 461 || code === 10009 || key === 'Backspace' || key === 'Escape') {
        if (evt.preventDefault) { evt.preventDefault(); }
        window.history.back();
      }
    }

    window.onresize = scaleStage;
    document.onkeydown = handleKeyDown;
    window.onload = function () {
      scaleStage();
      window.focus();
      initGenres();
    };
  </script>
</body>
</html>
