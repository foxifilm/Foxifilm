<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=1920, initial-scale=1.0">
  <meta http-equiv="refresh" content="8;url=index.html">
  <title>Foxifilm - Intro</title>
  <style type="text/css">
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #000000;
      display: table;
    }
    .intro-stage {
      display: table-cell;
      width: 100vw;
      height: 100vh;
      vertical-align: middle;
      text-align: center;
      padding: 4vh 4vw;
      background-color: #000000;
      cursor: pointer;
    }
    #intro-logo {
      max-width: 55vw;
      max-height: 55vh;
      width: auto;
      height: auto;
      opacity: 0;
      -webkit-animation: foxiFade 8s ease-in-out forwards;
      animation: foxiFade 8s ease-in-out forwards;
    }
    @-webkit-keyframes foxiFade {
      0%   { opacity: 0; }
      25%  { opacity: 1; }
      62.5%{ opacity: 1; }
      100% { opacity: 0; }
    }
    @keyframes foxiFade {
      0%   { opacity: 0; }
      25%  { opacity: 1; }
      62.5%{ opacity: 1; }
      100% { opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="intro-stage" id="intro-stage" onclick="goToIndex()">
    <img id="intro-logo" src="Foxilogo.png.png" alt="Foxifilm">
  </div>

  <script type="text/javascript">
    var redirected = false;

    function goToIndex() {
      if (redirected) {
        return;
      }
      redirected = true;
      window.location.href = 'index.html';
    }

    var timer = setTimeout(function () {
      goToIndex();
    }, 8000);

    function handleKeyDown(e) {
      var evt = e || window.event;
      var code = evt.keyCode || evt.which;
      if (code === 13 || code === 32) {
        if (evt.preventDefault) {
          evt.preventDefault();
        }
        clearTimeout(timer);
        goToIndex();
      }
    }

    document.onkeydown = handleKeyDown;
    window.onload = function () {
      window.focus();
    };
  </script>
</body>
</html>
