<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=1920, user-scalable=no">
  <script type="text/javascript">
    (function() {
      var scale = window.screen && window.screen.width ? (window.screen.width / 1920) : 0.5;
      if (scale > 0 && scale < 1) {
        var meta = document.querySelector('meta[name="viewport"]');
        if (meta) {
          meta.setAttribute('content', 'width=1920, initial-scale=' + scale + ', maximum-scale=' + scale + ', user-scalable=no');
        }
      }
    })();
  </script>
  <title>Foxifilm - Startseite</title>

  <style type="text/css">
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #000000;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      -webkit-user-select: none;
      user-select: none;
    }
    .hero-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 118vh;
      background-image: url('Asiabild.jpeg');
      background-position: center -16vh;
      background-size: cover;
      background-repeat: no-repeat;
      -webkit-transform: translateY(-6vh);
      transform: translateY(-6vh);
      z-index: 1;
    }
    .overlay-top-left {
      position: fixed;
      top: 0;
      left: 0;
      width: 65vw;
      height: 55vh;
      background: -webkit-radial-gradient(top left, ellipse cover, rgba(0, 0, 0, 0.92) 0%, rgba(0, 0, 0, 0.65) 45%, rgba(0, 0, 0, 0) 80%);
      background: radial-gradient(ellipse at top left, rgba(0, 0, 0, 0.92) 0%, rgba(0, 0, 0, 0.65) 45%, rgba(0, 0, 0, 0) 80%);
      z-index: 2;
      pointer-events: none;
    }
    .overlay-bottom {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100vw;
      height: 75vh;
      background: -webkit-linear-gradient(top, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 0.82) 45%, #000000 85%);
      background: linear-gradient(to bottom, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 0.82) 45%, #000000 85%);
      z-index: 2;
      pointer-events: none;
    }
    .app-shell {
      position: relative;
      z-index: 10;
      width: 100vw;
      height: 100vh;
      padding: 4vh 4vw;
    }
    .header-row {
      width: 100%;
      height: 17vh;
      position: relative;
    }
    .brand-logo {
      height: 17vh;
      width: auto;
      display: block;
      float: left;
    }
    .top-nav {
      float: right;
      padding-top: 2vh;
    }
    .info-btn {
      display: inline-block;
      background-color: rgba(15, 15, 15, 0.78);
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 2.1vh;
      font-weight: bold;
      padding: 1.2vh 2.2vh;
      margin-left: 1.4vw;
      border-radius: 6px;
      border: 3px solid rgba(255, 255, 255, 0.25);
      outline: none !important;
      cursor: pointer;
    }
    .hero-copy {
      position: absolute;
      left: 4vw;
      right: 4vw;
      bottom: 43vh;
    }
    .kicker {
      color: #ff4500;
      font-size: 2.1vh;
      font-weight: bold;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      margin-bottom: 1vh;
    }
    .main-title {
      color: #ffffff;
      font-size: 5.4vh;
      font-weight: bold;
      line-height: 1.1;
      margin-bottom: 1.2vh;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.85);
    }
    .subtitle {
      color: #e2e2e2;
      font-size: 2.4vh;
      line-height: 1.35;
      max-width: 68vw;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
    }
    .cards-row {
      position: absolute;
      left: 4vw;
      right: 4vw;
      bottom: 4vh;
      width: 92vw;
      display: flex;
      display: -webkit-flex;
      justify-content: space-between;
      -webkit-justify-content: space-between;
    }
    .poster-btn {
      position: relative;
      height: 36vh;
      width: 24vh;
      background-color: #141414;
      border-radius: 10px;
      overflow: hidden;
      border: 3px solid transparent;
      outline: none !important;
      padding: 0;
      cursor: pointer;
    }
    .poster-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .poster-label-bar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 3.5vh 1vh 1.4vh 1vh;
      background: -webkit-linear-gradient(top, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 0.92) 70%);
      background: linear-gradient(to bottom, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 0.92) 70%);
      color: #ffffff;
      font-size: 2.5vh;
      font-weight: bold;
      text-align: center;
      text-shadow: 0 2px 6px #000000;
    }
    .is-focused {
      border: 3px solid #ffd700 !important;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.6) !important;
    }
  </style>
</head>
<body>
  <div class="hero-bg"></div>
  <div class="overlay-top-left"></div>
  <div class="overlay-bottom"></div>

  <div class="app-shell">
    <div class="header-row">
      <img class="brand-logo" src="Foxilogo.png.png" alt="Foxifilm">
      <div class="top-nav">
        <button type="button" class="info-btn" data-index="0" data-href="jugendschutz.html">Jugendschutz</button>
        <button type="button" class="info-btn" data-index="1" data-href="impressum.html">Impressum</button>
        <button type="button" class="info-btn" data-index="2" data-href="rechtliches.html">Rechtliches</button>
      </div>
    </div>

    <div class="hero-copy">
      <div class="kicker">DEIN EXKLUSIVES HEIMKINO-ERLEBNIS</div>
      <h1 class="main-title">Willkommen bei Foxifilm</h1>
      <p class="subtitle">Großes Kino, fesselnde Serien und spannende Dokus für zu Hause - jetzt entdecken.</p>
    </div>

    <div class="cards-row">
      <button type="button" class="poster-btn" data-index="3" data-href="suche.html">
        <img src="Suchen.jpeg" alt="Suchen">
        <div class="poster-label-bar">Suchen</div>
      </button>

      <button type="button" class="poster-btn" data-index="4" data-href="Genres.html">
        <img src="Genres.jpeg" alt="Genres">
        <div class="poster-label-bar">Genres</div>
      </button>

      <button type="button" class="poster-btn" data-index="5" data-href="filme.html">
        <img src="Filme.jpeg" alt="Filme">
        <div class="poster-label-bar">Filme</div>
      </button>

      <button type="button" class="poster-btn" data-index="6" data-href="serien.html">
        <img src="Serien.jpeg" alt="Serien">
        <div class="poster-label-bar">Serien</div>
      </button>

      <button type="button" class="poster-btn" data-index="7" data-href="self-made-content.html">
        <img src="Eigene Produktionen.jpeg" alt="Self-made-Content">
        <div class="poster-label-bar">Self-made-Content</div>
      </button>

      <button type="button" class="poster-btn" data-index="8" data-href="ueberfoxi.html">
        <img src="Über Foxifilm.jpeg" alt="Über Foxifilm">
        <div class="poster-label-bar">Über Foxifilm</div>
      </button>
    </div>
  </div>

  <script type="text/javascript">
    var navButtons = [];
    var currentIndex = 3;

    function initButtons() {
      var allBtns = document.getElementsByTagName('button');
      var i;
      for (i = 0; i < allBtns.length; i++) {
        navButtons.push(allBtns[i]);
        attachEvents(allBtns[i], i);
      }
      setFocus(3);
    }

    function clearAllFocus() {
      var i;
      if (document.activeElement && document.activeElement.blur) {
        document.activeElement.blur();
      }
      for (i = 0; i < navButtons.length; i++) {
        navButtons[i].className = navButtons[i].className.replace(/\s*is-focused/g, '');
      }
    }

    function setFocus(index) {
      if (index < 0) {
        index = 0;
      }
      if (index >= navButtons.length) {
        index = navButtons.length - 1;
      }
      clearAllFocus();
      currentIndex = index;
      navButtons[currentIndex].className += ' is-focused';
    }

    function navigateTo(index) {
      var target = navButtons[index].getAttribute('data-href');
      if (target) {
        window.location.href = target;
      }
    }

    function attachEvents(btn, idx) {
      btn.onmouseenter = function () {
        setFocus(idx);
      };
      btn.onmouseleave = function () {
        clearAllFocus();
      };
      btn.onclick = function () {
        navigateTo(idx);
      };
    }

    function handleKeyDown(e) {
      var evt = e || window.event;
      var code = evt.keyCode || evt.which;

      if (code === 39) {
        if (evt.preventDefault) { evt.preventDefault(); }
        if (currentIndex < 2) {
          setFocus(currentIndex + 1);
        } else if (currentIndex >= 3 && currentIndex < 8) {
          setFocus(currentIndex + 1);
        }
      } else if (code === 37) {
        if (evt.preventDefault) { evt.preventDefault(); }
        if (currentIndex > 0 && currentIndex <= 2) {
          setFocus(currentIndex - 1);
        } else if (currentIndex > 3) {
          setFocus(currentIndex - 1);
        }
      } else if (code === 40) {
        if (evt.preventDefault) { evt.preventDefault(); }
        if (currentIndex <= 2) {
          setFocus(currentIndex + 6);
        }
      } else if (code === 38) {
        if (evt.preventDefault) { evt.preventDefault(); }
        if (currentIndex >= 3) {
          if (currentIndex <= 4) {
            setFocus(0);
          } else if (currentIndex <= 6) {
            setFocus(1);
          } else {
            setFocus(2);
          }
        }
      } else if (code === 13) {
        if (evt.preventDefault) { evt.preventDefault(); }
        navigateTo(currentIndex);
      }
    }

    document.onkeydown = handleKeyDown;
    window.onload = function () {
      window.focus();
      initButtons();
    };
        // Hintergrundbild alle 10 Minuten automatisch wechseln
    (function() {
      var bilder = [
        'Gemini_Generated_Image_1b9cb11b9cb11b9c.jpeg',
        'Gemini_Generated_Image_i4yly6i4yly6i4yl.jpeg',
        'Gemini_Generated_Image_kbr28bkbr28bkbr2.jpeg',
        'Gemini_Generated_Image_vikf0vvikf0vvikf.jpeg',
        'Gemini_Generated_Image_va3uscva3uscva3u.jpeg',
        'Gemini_Generated_Image_iu45mfiu45mfiu45.jpeg',
        'Gemini_Generated_Image_qmmdw4qmmdw4qmmd.jpeg',
        'Gemini_Generated_Image_qef23jqef23jqef2.jpeg'
      ];

      function aktualisiereHintergrund() {
        var zehnMinutenBlock = Math.floor(Date.now() / (1000 * 60 * 10));
        var bildIndex = zehnMinutenBlock % bilder.length;
        var heroBg = document.querySelector('.hero-bg');
        if (heroBg) {
          heroBg.style.backgroundImage = "url('" + bilder[bildIndex] + "')";
        }
      }

      aktualisiereHintergrund();
      setInterval(aktualisiereHintergrund, 30000);
    })();

  </script>
</body>
</html>
