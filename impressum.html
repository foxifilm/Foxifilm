<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Foxifilm - Impressum</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    width: 100vw;
    height: 100vh;
    background-color: #000000;
    color: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  #stage {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 1920px;
    height: 1080px;
    margin-left: -960px;
    margin-top: -540px;
    background-color: #000000;
    overflow: hidden;
    transform-origin: center center;
  }

  .header-area {
    position: absolute;
    top: 0;
    left: 0;
    width: 1920px;
    height: 250px;
    background-color: #000000;
    text-align: center;
    padding-top: 32px;
    z-index: 50;
    pointer-events: none;
  }

  .brand-logo {
    display: inline-block;
    height: 135px;
    width: auto;
    margin-bottom: 14px;
    border: none;
    outline: none;
  }

  .page-title {
    font-size: 54px;
    font-weight: bold;
    color: #ffffff;
    letter-spacing: 1.5px;
    line-height: 1.1;
    text-align: center;
  }

  .content-box {
    position: absolute;
    top: 310px;
    left: 260px;
    width: 1400px;
    text-align: center;
  }

  .section-heading {
    font-size: 32px;
    font-weight: bold;
    color: #ff5722;
    margin-bottom: 24px;
    line-height: 1.3;
  }

  .info-line {
    font-size: 28px;
    color: #ffffff;
    line-height: 1.7;
    margin-bottom: 10px;
  }

  .footer-area {
    position: absolute;
    bottom: 65px;
    left: 0;
    width: 1920px;
    text-align: center;
    z-index: 40;
  }

  .back-btn {
    display: inline-block;
    padding: 18px 54px;
    font-size: 28px;
    font-weight: bold;
    color: #ffffff;
    background-color: #161616;
    border: 4px solid #333333;
    border-radius: 10px;
    outline: none;
    cursor: pointer;
    font-family: Arial, Helvetica, sans-serif;
    transition: none;
    -webkit-transition: none;
  }

  .back-btn.is-focused {
    border: 4px solid #ffd700;
    box-shadow: 0 0 22px rgba(255, 215, 0, 0.85);
  }
</style>
</head>
<body>
  <div id="stage">
    <div class="header-area">
      <img class="brand-logo" src="Foxilogo.png.png" alt="Foxifilm Logo" tabindex="-1">
      <h1 class="page-title">Impressum</h1>
    </div>

    <div class="content-box">
      <h2 class="section-heading">Angaben gem&auml;&szlig; &sect; 5 DDG</h2>
      <p class="info-line">Chief Executive Officer (CEO) Michael K&uuml;hn</p>
      <p class="info-line">Liebenwerdaer Str. 22</p>
      <p class="info-line">04924 Bad Liebenwerda / Maasdorf</p>
      <p class="info-line" style="margin-top: 24px;">E-Mail: Foxifilmbusiness@web.de</p>
    </div>

    <div class="footer-area">
      <button type="button" id="btn-back" class="back-btn">Zur&uuml;ck</button>
    </div>
  </div>

<script type="text/javascript">
(function() {
  var stage = document.getElementById("stage");
  var backBtn = document.getElementById("btn-back");

  function scaleStage() {
    var winW = window.innerWidth || document.documentElement.clientWidth || 1920;
    var winH = window.innerHeight || document.documentElement.clientHeight || 1080;
    var scaleX = winW / 1920;
    var scaleY = winH / 1080;
    var scale = scaleX < scaleY ? scaleX : scaleY;
    var transformValue = "scale(" + scale + ")";
    stage.style.webkitTransform = transformValue;
    stage.style.msTransform = transformValue;
    stage.style.transform = transformValue;
  }

  function setFocus() {
    backBtn.className = "back-btn is-focused";
    backBtn.focus();
  }

  function clearFocus() {
    backBtn.className = "back-btn";
    if (document.activeElement === backBtn) {
      backBtn.blur();
    }
  }

  function goBack() {
    window.history.back();
  }

  backBtn.onmouseenter = function() {
    setFocus();
  };

  backBtn.onmouseleave = function() {
    clearFocus();
  };

  backBtn.onclick = function() {
    goBack();
  };

  document.onkeydown = function(e) {
    var evt = e || window.event;
    var keyCode = evt.keyCode || evt.which;

    // Zurück-Tasten (Backspace, Escape, Fire TV, LG, Samsung) -> immer genau eine Seite zurück
    if (keyCode === 8 || keyCode === 27 || keyCode === 4 || keyCode === 461 || keyCode === 10009) {
      if (evt.preventDefault) {
        evt.preventDefault();
      }
      goBack();
      return false;
    }

    // Pfeiltasten (Hoch, Runter, Links, Rechts)
    if (keyCode === 37 || keyCode === 38 || keyCode === 39 || keyCode === 40) {
      if (evt.preventDefault) {
        evt.preventDefault();
      }
      setFocus();
      return false;
    }

    // OK / Enter (13)
    if (keyCode === 13) {
      if (evt.preventDefault) {
        evt.preventDefault();
      }
      goBack();
      return false;
    }
  };

  window.onresize = scaleStage;

  scaleStage();
  setFocus();
})();
</script>
</body>
</html>
